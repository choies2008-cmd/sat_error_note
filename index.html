<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f5f1" />
  <title>사문 오답 분석</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div>
        <div class="eyebrow">SOCIAL & CULTURE</div>
        <h1>사문 오답 분석</h1>
      </div>
      <button id="headerAddBtn" class="icon-btn" aria-label="새 오답 기록 추가">＋</button>
    </header>

    <main id="mainContent" class="main-content"></main>

    <nav class="bottom-nav" aria-label="주 메뉴">
      <button class="nav-btn active" data-tab="records"><span>📝</span><b>기록</b></button>
      <button class="nav-btn" data-tab="analysis"><span>📊</span><b>분석</b></button>
      <button class="nav-btn" data-tab="settings"><span>⚙️</span><b>설정</b></button>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
